[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kannadallmbench"
version = "0.2.0"
description = "Kannada-first LLM evaluation suite, data pipelines, and leaderboard infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "KannadaLLMBench contributors"}]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
data = ["datasets>=3.2,<5", "huggingface-hub>=0.27,<1"]
metrics = ["sacrebleu>=2.4,<3", "rouge-score>=0.1.2,<1"]
dev = ["build>=1.2,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]
all = ["kannadallmbench[data,metrics,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
